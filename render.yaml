services:
  # Backend1 — WebSocket Game Server
  - type: web
    name: knightshift-ws
    runtime: node
    rootDir: Backend1
    buildCommand: apt-get install -y stockfish && npm install && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Backend2 — REST API / Auth Server
  - type: web
    name: knightshift-api
    runtime: node
    rootDir: Backend2
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 8000
      - key: DB
        sync: false        # set manually in Render dashboard
      - key: SALT
        value: "7"
      - key: JWTPRIVATEKEY
        sync: false        # set manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false        # set manually in Render dashboard
